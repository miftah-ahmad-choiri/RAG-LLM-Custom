# ─── Paths ─────────────────────────────────────────────────────────────
paths:
  md_root: "output/md/20260922_234455-IBM-Ceph-TOC-20260922_231027"
  chroma_db: "E:/ceph-rag/chroma_db"
  collection_name: "ibm_ceph_docs"

# ─── Chunking ──────────────────────────────────────────────────────────
chunking:
  max_tokens: 1024
  overlap_tokens: 100
  min_chunk_tokens: 30
  preserve_headings: true
  include_parent_context: true

# ─── Embeddings — Ollama (GPU-accelerated via Ollama's own CUDA runtime) ───────
embeddings:
  provider: "ollama"
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"
  batch_size: 16

# ─── Vector DB ─────────────────────────────────────────────────────────
vectordb:
  provider: "chromadb"
  hnsw_space: "cosine"
  hnsw_construction_ef: 200
  hnsw_M: 16

# ─── Retrieval ─────────────────────────────────────────────────────────
retrieval:
  top_k: 8
  # Chunks with cosine similarity below this threshold are discarded before
  # being sent to the LLM. 0.0 = disabled. Recommended: 0.65–0.70.
  min_score: 0.65
  # If the best retrieved chunk scores below this value the LLM is told the
  # context may be insufficient and should not speculate.
  low_confidence_threshold: 0.72

  # Optional filters (uncomment to use):
  # chapter_filter: "11-planning"
  # content_type_filter: "procedure"
  # topic_tags: ["crush", "osd"]

# ─── LLM (Swappable) ───────────────────────────────────────────────────
llm:
  # Option 1: Local Ollama (FREE) — DEFAULT
  provider: "ollama"
  model: "llama3.2:3b"
  base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 2048

  # Option 2: GPT-4o-mini (CHEAP) — uncomment to use
  # provider: "openai"
  # model: "gpt-4o-mini"
  # api_key: "${OPENAI_API_KEY}"
  # temperature: 0.1
  # max_tokens: 2048

  # Option 3: GPT-4o (BEST) — uncomment to use
  # provider: "openai"
  # model: "gpt-4o"
  # api_key: "${OPENAI_API_KEY}"
  # temperature: 0.1
  # max_tokens: 2048

# ─── Prompt Template ───────────────────────────────────────────────────
prompt:
  system: |
    You are an IBM Storage Ceph 9.9.1 expert assistant. Answer ONLY from the context provided.
    Rules:
    - NEVER invent, guess, or extrapolate commands, options, file paths, or values not present verbatim in the context.
    - Copy CLI commands character-for-character as they appear in the context. Do not paraphrase commands.
    - Do not combine steps from unrelated sections into a single procedure.
    - If the context contains a clear procedure, present it as numbered steps in the order given.
    - If the context does NOT contain a direct answer, say exactly: "This is not covered in the available documentation."
    - Do not add disclaimers like "Note that steps may vary" — either the docs say it or they don't.
    - NEVER echo or repeat the source labels (e.g. "[Source 1: ...]") in your answer. Those are internal references only.
    - When multiple sources cover the same topic, prefer the one tagged as a procedure over concept or reference.
  system_low_confidence: |
    You are an IBM Storage Ceph 9.9.1 expert assistant. The retrieved context has LOW confidence relevance to the question.
    Rules:
    - Be explicit at the start: "The available documentation does not directly address this question."
    - Only share what IS in the context that could be partially relevant.
    - NEVER invent commands, steps, or configuration values.
    - Do not speculate about how Ceph might work — only quote from the context.
    - NEVER echo or repeat the source labels (e.g. "[Source 1: ...]") in your answer.
  template: |
    Context:
    {context}

    Question: {question}

    Answer: