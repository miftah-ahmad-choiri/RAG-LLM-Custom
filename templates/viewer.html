<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ filename }} — IBM Ceph Docs</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* ── Layout ──────────────────────────────────────────────────────── */
    :root {
      --sidebar-w: 272px;
      --header-h: 52px;
    }

    .viewer-layout {
      display: flex;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 0 80px;
      gap: 0;
      align-items: flex-start;
    }

    /* ── TOC Sidebar ─────────────────────────────────────────────────── */
    .toc-sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: calc(var(--header-h) + 16px);
      max-height: calc(100vh - var(--header-h) - 32px);
      overflow-y: auto;
      padding: 24px 0 24px 20px;
      border-right: 1px solid var(--border);
    }
    .toc-sidebar-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted);
      margin-bottom: 12px; padding-left: 4px;
    }
    /* Python-markdown TOC output */
    .toc-sidebar .toc { list-style: none; padding: 0; }
    .toc-sidebar .toc li { margin: 0; }
    .toc-sidebar .toc a {
      display: block; font-size: 12.5px; color: var(--text);
      padding: 4px 8px; border-radius: 4px; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border-left: 2px solid transparent;
      transition: background .12s, color .12s;
    }
    .toc-sidebar .toc a:hover { background: var(--surface-2); color: var(--accent-h); }
    .toc-sidebar .toc a.active { border-left-color: var(--accent); color: var(--accent-h); background: #1c2e4a; }

    /* Indent nested levels */
    .toc-sidebar .toc ul { list-style: none; padding-left: 14px; }
    .toc-sidebar > div > ul > li > a { font-weight: 600; }
    .toc-sidebar > div > ul > li > ul > li > a { font-size: 12px; }
    .toc-sidebar > div > ul > li > ul > li > ul > li > a { font-size: 11.5px; color: var(--muted); }
    .toc-sidebar > div > ul > li > ul > li > ul > li > ul > li > a { font-size: 11px; color: var(--muted); }

    /* ── Article ─────────────────────────────────────────────────────── */
    .article-wrap {
      flex: 1;
      min-width: 0;
      padding: 32px 48px 60px;
    }

    /* ── File meta bar ───────────────────────────────────────────────── */
    .file-meta-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 28px;
      font-size: 12.5px; color: var(--muted);
    }
    .file-meta-bar .filename {
      font-family: var(--mono); font-size: 12.5px;
      color: var(--text); font-weight: 600;
    }
    .file-meta-bar .sep { color: var(--border); }
    .meta-actions { margin-left: auto; display: flex; gap: 8px; }

    /* ── Markdown body (GitHub style) ────────────────────────────────── */
    .md-body { font-size: 15px; line-height: 1.7; color: var(--text); }

    .md-body h1 {
      font-size: 2rem; font-weight: 700;
      margin: 0 0 8px; padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    .md-body h2 {
      font-size: 1.4rem; font-weight: 700;
      margin: 2.6rem 0 .7rem; padding-bottom: .45rem;
      border-bottom: 1px solid var(--border);
    }
    .md-body h3 { font-size: 1.15rem; font-weight: 700; margin: 2rem 0 .5rem; }
    .md-body h4 { font-size: 1rem;    font-weight: 600; margin: 1.6rem 0 .4rem; }
    .md-body h5 { font-size: .9rem;   font-weight: 600; margin: 1.4rem 0 .4rem; color: var(--muted); }
    .md-body h6 { font-size: .85rem;  font-weight: 600; margin: 1.2rem 0 .3rem; color: var(--muted); }

    /* Permalink anchors from TocExtension */
    .md-body .headerlink {
      opacity: 0; margin-left: 6px; font-size: .8em;
      color: var(--accent); text-decoration: none;
      transition: opacity .15s;
    }
    .md-body h1:hover .headerlink,
    .md-body h2:hover .headerlink,
    .md-body h3:hover .headerlink,
    .md-body h4:hover .headerlink,
    .md-body h5:hover .headerlink { opacity: 1; }

    .md-body p { margin: .75rem 0; }
    .md-body ul, .md-body ol { margin: .6rem 0 .6rem 1.6rem; }
    .md-body li { margin: .3rem 0; }
    .md-body a { color: var(--accent); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }

    .md-body blockquote {
      border-left: 3px solid var(--accent);
      background: #1c2e4a;
      padding: 10px 16px; margin: 1rem 0;
      border-radius: 0 5px 5px 0;
      color: #adbac7; font-size: .93rem;
    }

    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 2.2rem 0; }

    /* Tables */
    .md-body table {
      border-collapse: collapse; width: 100%;
      font-size: .88rem; margin: 1rem 0;
      display: block; overflow-x: auto;
    }
    .md-body th, .md-body td {
      border: 1px solid var(--border); padding: 7px 13px;
      text-align: left; vertical-align: top;
    }
    .md-body th { background: var(--surface-2); font-weight: 600; }
    .md-body tr:nth-child(even) td { background: #1a1f27; }

    /* Inline code */
    .md-body :not(pre) > code {
      background: var(--surface-2); color: #e06c75;
      padding: 1px 5px; border-radius: 3px;
      font-size: .88em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    /* Code blocks — Pygments CodeHilite wraps in .highlight div */
    .md-body .highlight {
      position: relative;
      margin: 1rem 0; border-radius: 6px; overflow: hidden;
    }
    .md-body .highlight pre {
      background: #0d1117; color: #c9d1d9;
      padding: 16px 20px; margin: 0;
      overflow-x: auto; font-size: .84rem; line-height: 1.6;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    /* Pygments token colours (dark) */
    .md-body .highlight .k  { color: #ff7b72; } /* keyword */
    .md-body .highlight .s, .md-body .highlight .s1, .md-body .highlight .s2 { color: #a5d6ff; } /* string */
    .md-body .highlight .c, .md-body .highlight .c1, .md-body .highlight .cm  { color: #8b949e; font-style: italic; } /* comment */
    .md-body .highlight .n  { color: #c9d1d9; } /* name */
    .md-body .highlight .nb { color: #79c0ff; } /* builtin */
    .md-body .highlight .nf { color: #d2a8ff; } /* function name */
    .md-body .highlight .o  { color: #ff7b72; } /* operator */
    .md-body .highlight .mi, .md-body .highlight .mf { color: #79c0ff; } /* number */
    .md-body .highlight .cp { color: #d2a8ff; } /* preprocessor */

    /* Copy button */
    .copy-btn {
      position: absolute; top: 8px; right: 10px;
      background: #30363d; border: 1px solid #484f58;
      border-radius: 4px; color: #c9d1d9;
      font-size: 11px; padding: 3px 10px; cursor: pointer;
      opacity: 0; transition: opacity .15s;
    }
    .md-body .highlight:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: #3c444d; color: #fff; }
    .copy-btn.copied { background: #238636; border-color: #2ea043; color: #fff; }

    /* Definition lists */
    .md-body dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; font-size: .9rem; margin: .7rem 0; }
    .md-body dt { font-weight: 600; color: var(--muted); }
    .md-body dd { margin: 0; }

    /* ── Back to top ─────────────────────────────────────────────────── */
    #back-top {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 50%; width: 42px; height: 42px; font-size: 20px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.22); transition: background .15s;
    }
    #back-top:hover { background: var(--accent-h); }
    #back-top.visible { display: flex; }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .toc-sidebar { display: none; }
      .article-wrap { padding: 20px 18px 60px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="6" fill="#0f62fe"/>
          <path d="M8 10h16M8 16h12M8 22h8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="header-title">IBM Ceph Docs Scraper</span>
      </div>
      <nav style="display:flex;gap:6px;">
        <a href="/" class="btn btn-secondary" style="padding:5px 14px;font-size:12.5px;text-decoration:none;">⚙️ Scraper</a>
        <a href="/toc" class="btn btn-secondary" style="padding:5px 14px;font-size:12.5px;text-decoration:none;">📋 TOC</a>
        <a href="/docs" class="btn btn-primary" style="padding:5px 14px;font-size:12.5px;text-decoration:none;">📄 Docs</a>
        <a href="/rag" class="btn btn-secondary" style="padding:5px 14px;font-size:12.5px;text-decoration:none;">🔍 RAG</a>
      </nav>
    </div>
  </header>

  <div class="viewer-layout">

    <!-- TOC Sidebar -->
    <aside class="toc-sidebar" id="toc-sidebar">
      <div class="toc-sidebar-title">Contents</div>
      <div id="toc-container">
        {{ toc_html | safe }}
      </div>
    </aside>

    <!-- Article -->
    <div class="article-wrap">

      <!-- File meta bar -->
      <div class="file-meta-bar">
        <a href="/docs" style="color:var(--muted);text-decoration:none;font-size:12px;">📁 output</a>
        <span class="sep">/</span>
        <span class="filename">{{ filename }}</span>
        <span class="sep">·</span>
        <span>{{ "%.1f"|format(file_size / 1024) }} KB</span>
        <span class="sep">·</span>
        <span>{{ line_count }} lines</span>
        <span class="sep">·</span>
        <span>Updated {{ file_mtime }}</span>
        <div class="meta-actions">
          <a href="/api/download/{{ filename }}" class="btn btn-secondary" style="padding:4px 12px;font-size:12px;text-decoration:none;"
             onclick="return triggerRawDownload(event)">⬇ Download</a>
        </div>
      </div>

      <!-- Rendered markdown -->
      <article class="md-body" id="md-body">
        {{ html_body | safe }}
      </article>

    </div>
  </div>

  <button id="back-top" title="Back to top">↑</button>

  <script>
    // ── Copy buttons on code blocks ───────────────────────────────────
    document.querySelectorAll('.highlight').forEach(block => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      block.appendChild(btn);
      btn.addEventListener('click', () => {
        const code = block.querySelector('pre');
        navigator.clipboard.writeText(code ? code.innerText : '').then(() => {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
        });
      });
    });

    // ── Active TOC highlight on scroll ───────────────────────────────
    const tocLinks = document.querySelectorAll('#toc-container a');
    const headings = Array.from(document.querySelectorAll('.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5'));

    if (tocLinks.length && headings.length) {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const id = e.target.id;
            tocLinks.forEach(a => {
              a.classList.toggle('active', a.getAttribute('href') === '#' + id);
            });
            // Scroll active link into sidebar view
            const active = document.querySelector('#toc-container a.active');
            if (active) {
              const sidebar = document.getElementById('toc-sidebar');
              sidebar.scrollTo({ top: active.offsetTop - sidebar.clientHeight / 2, behavior: 'smooth' });
            }
          }
        });
      }, { rootMargin: '-60px 0px -65% 0px', threshold: 0 });
      headings.forEach(h => obs.observe(h));
    }

    // ── Back to top ───────────────────────────────────────────────────
    const backBtn = document.getElementById('back-top');
    window.addEventListener('scroll', () => {
      backBtn.classList.toggle('visible', window.scrollY > 500);
    });
    backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ── Raw download (bypass job-based route — serve file directly) ───
    function triggerRawDownload(e) {
      e.preventDefault();
      const filename = {{ filename | tojson }};
      window.location.href = '/docs/raw/' + filename;
      return false;
    }
  </script>

</body>
</html>
